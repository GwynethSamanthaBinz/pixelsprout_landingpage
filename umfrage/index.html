  <meta name="robots" content="noindex">
  <!-- Once the questionnaire is published, put its link into FORM_URL:

  <script>
    var FORM_URL = '';
    if (FORM_URL) location.replace(FORM_URL);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(#BFE0F5, #DCC9F0); font-family: system-ui, sans-serif; color: #2b2540; }
    .box { background: #fff; border: 3px solid #543d90; border-radius: 6px; padding: 28px 24px; margin: 16px;
      max-width: 360px; text-align: center; box-shadow: 0 4px 0 #9f90e0; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>PixelSprout Beta-Feedback</h1>
    <p>Der Fragebogen ist ab dem 8.11. hier erreichbar. Danke fürs Testen!</p>

  </div>

</html>
